name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Ruff lint
        run: ruff check . || true
      - name: Syntax check
        run: |
          for f in *.py; do [ -f "$f" ] && python -m py_compile "$f"; done
